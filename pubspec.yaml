name: maya_player
description: "Maya Player - Modern Android video player powered by mpv with VLC-like discovery."
publish_to: 'none'
version: 0.0.1-alpha.3+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # MPV Engine via media_kit
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.8
  screen_brightness_platform_interface: ^2.1.2

  # Media Discovery & File Handling
  photo_manager: ^3.6.4
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  path: ^1.9.0
  device_info_plus: ^11.1.0

  # UI & Utilities
  cupertino_icons: ^1.0.8
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
